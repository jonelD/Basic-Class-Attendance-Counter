<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Class Attendance Counter</title>
</head>
<body>
    <div class="background">
        <div class="container">
            <h2>Class Attendance Counter</h2>
            <h3>Students Present Today: </h3>
            <h2 id="student-el">0</h2>

            <div class="button-container">
                <button class="btn-add" onclick="addStudent()">Add Student</button> 
                <button class="btn-remove" onclick="removeStudent()">Remove Student</button>
                <button class="btn-reset" onclick="resetStudent()">Reset</button>

    </div>
    

    <script src="script.js"></script>
</body>
</html>
